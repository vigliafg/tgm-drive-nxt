name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**.md', 'LICENSE', '.gitignore']
  pull_request:
    branches: [main]

permissions:
  contents: write
  actions: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux-x64
            add_data_sep: ':'
            gui_flag: ''

          - os: windows-2022
            name: windows-x64
            add_data_sep: ';'
            gui_flag: '--noconsole'

          - os: macos-latest
            name: macos-arm64
            add_data_sep: ':'
            gui_flag: '--windowed'

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        shell: bash
        run: |
          pyinstaller \
            --onefile \
            --clean \
            ${{ matrix.gui_flag }} \
            --name TGMDriveNXT \
            --add-data "gui${{ matrix.add_data_sep }}gui" \
            --hidden-import PyQt6.QtCore \
            --hidden-import PyQt6.QtGui \
            --hidden-import PyQt6.QtWidgets \
            --hidden-import telethon \
            --hidden-import telethon.client \
            --hidden-import telethon.tl \
            main.py

      - name: Rename binary with platform suffix
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            mv dist/TGMDriveNXT.exe "dist/TGMDriveNXT-${{ matrix.name }}.exe"
          else
            mv dist/TGMDriveNXT "dist/TGMDriveNXT-${{ matrix.name }}"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tgm-drive-nxt-${{ matrix.name }}
          path: dist/TGMDriveNXT-${{ matrix.name }}${{ runner.os == 'Windows' && '.exe' || '' }}
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: false
